# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  linter_and_tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby-version: ['3.3.1']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
    # To automatically get bug fixes and new Ruby versions for ruby/setup-ruby,
    # change this to (see https://github.com/ruby/setup-ruby#versioning):
    # uses: ruby/setup-ruby@v1
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Run linter
      run: bundle exec standardrb
    - name: Run tests
      run: bundle exec rspec
    - name: Check eager loading
      run: bundle exec rails zeitwerk:check
      env:
        RAILS_ENV: test
    - name: Check production boot
      run: |
        bundle exec rails runner 'puts "Rails #{Rails.version} production boot passed"'
      env:
        RAILS_ENV: production
        SECRET_KEY_BASE: synthetic-ci-secret-key-base
        SLACK_SIGNING_SECRET: synthetic-ci-signing-secret
        SENTRY_CURRENT_ENV: ci
    # set up later!
    # - uses: joshmfrankel/simplecov-check-action@main
    #   with:
    #     github_token: ${{ secrets.GITHUB_TOKEN }}
    #     minimum_suite_coverage: 80

  security:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3.1'
        bundler-cache: true
    - name: Audit dependencies
      run: bundle exec bundler-audit check --update
    - name: Scan application security
      if: always()
      run: bundle exec brakeman --no-pager
